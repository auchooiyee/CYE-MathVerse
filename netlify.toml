# Netlify Configuration for CYE-MathVerse

[build]
  # Static HTML files are in the root
  publish = "."
  command = ""

# Standard caching headers for static assets
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "ALLOWALL"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
