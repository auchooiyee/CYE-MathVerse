<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Teal-Emerald Neon Gradient -->
    <linearGradient id="neon-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Indigo-Violet Gradient -->
    <linearGradient id="neon-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Rounded Hexagon / Shield -->
  <polygon points="100,12 178,57 178,143 100,188 22,143 22,57" fill="url(#bg-grad)" stroke="url(#neon-teal)" stroke-width="4" filter="url(#glow)" />

  <!-- Inner Cyber Ring -->
  <polygon points="100,24 167,63 167,137 100,176 33,137 33,63" fill="none" stroke="url(#neon-purple)" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6" />

  <!-- Orbiting Rings -->
  <ellipse cx="100" cy="100" rx="65" ry="24" fill="none" stroke="#38bdf8" stroke-width="2" transform="rotate(-30 100 100)" opacity="0.8" />
  <circle cx="152" cy="70" r="4.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="48" cy="130" r="3.5" fill="#a855f7" filter="url(#glow)" />

  <!-- Mathematical Core: Stylized Delta / Triangle + Sigma + Function Symbol -->
  <g transform="translate(100, 96)">
    <!-- Central Sigma / Function / Portal Symbol -->
    <path d="M-28,-32 L28,-32 L28,-22 L-10,-22 L12,0 L-10,22 L28,22 L28,32 L-28,32 L-4,0 Z" fill="url(#neon-teal)" filter="url(#glow)" />
    <!-- Dynamic Infinity / Calculus loop overlay -->
    <path d="M-18,2 C-18,-12 18,-12 18,2 C18,16 -18,16 -18,2 Z" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.85" />
    <circle cx="0" cy="2" r="3.5" fill="#f59e0b" filter="url(#glow)" />
  </g>

  <!-- Bottom Sparkle Badge -->
  <polygon points="100,172 103,178 109,181 103,184 100,190 97,184 91,181 97,178" fill="#38bdf8" />
</svg>
